name: Deploy Portfolio Status Collector
on:
  push:
    branches: [main]
    paths:
      - 'workers/portfolio-status/**'
      - 'scripts/deployment/deploy-status-worker.mjs'
      - 'tests/worker/uptime.test.js'
      - '.github/workflows/deploy-status-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-status-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify database transitions and public API
        run: node --test tests/worker/uptime.test.js
      - name: Deploy collector and preserve persistent records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFARE_API_KEY: ${{ secrets.CLOUDFARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: node scripts/deployment/deploy-status-worker.mjs
      - name: Verify published revision and durable API
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://portfolio-status.mangeshraut712.workers.dev';
          let verified=false;
          for(let attempt=0;attempt<12;attempt++) {
            const health=await fetch(`${base}/health?verify=${Date.now()}`).then(r=>r.json());
            if(health.version===process.env.EXPECTED_SHA) {verified=true;break;}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          assert.ok(verified,'Collector revision must match this commit');
          const response=await fetch(`${base}/api/history`);
          assert.equal(response.status,200);
          const history=await response.json();
          assert.equal(history.services.length,6);
          assert.equal(history.window_days,90);
          console.log('Collector revision and persistent history verified.');
          JS
