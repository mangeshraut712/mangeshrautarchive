# Portfolio Reach sync (GA4 → Cloudflare edge snapshot)
#
# Keeps the "Portfolio Reach" number accurate while Vercel is offline. Boots the
# FastAPI backend with the GA4 service account, re-exports the edge snapshot
# consumed by the Cloudflare Worker (workers/assistme-chat/src/edge-data-snapshot.js),
# then records a values-free review signal in a short-lived artifact. An
# authorized human must regenerate and inspect the candidate before opening a
# normal reviewed pull request for the main-branch worker deployment.
#
# Required secret:
#   GOOGLE_ANALYTICS_SERVICE_ACCOUNT_JSON — GA4 service-account key JSON. The
#     service account must have Viewer access on GA4 property 537627192.
# Optional repository variables (fall back to the portfolio defaults):
#   GA4_PROPERTY_ID (537627192), GA4_ACCOUNT_ID (394742220)
#
# The job self-skips when the GA4 secret is absent, so it never overwrites the
# live snapshot with mock/store fallback numbers. Generated values are never
# written to public workflow artifacts or public workflow logs. The artifact
# records only whether an authorized maintainer needs to regenerate a candidate
# in a controlled environment for normal pull-request review.

name: Portfolio reach sync (GA4 → edge)

on:
  schedule:
    # Every 6 hours (offset to avoid the top-of-hour cron rush)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: analytics-reach-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh reach snapshot from GA4
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Gate on GA4 secret
        id: gate
        env:
          GA_JSON: ${{ secrets.GOOGLE_ANALYTICS_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${GA_JSON:-}" ]; then
            echo "::warning::GOOGLE_ANALYTICS_SERVICE_ACCOUNT_JSON is not set — skipping reach sync."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade 'pip>=26.2.2'
          pip install -r requirements.txt

      - name: Start FastAPI backend
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_ANALYTICS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_ANALYTICS_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || '537627192' }}
          GA4_ACCOUNT_ID: ${{ vars.GA4_ACCOUNT_ID || '394742220' }}
          NO_RELOAD: '1'
        run: |
          set -euo pipefail
          python -m uvicorn api.index:app --host 127.0.0.1 --port 8001 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/api/health > /dev/null; then
              echo "Backend healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::FastAPI backend failed to start; backend output is withheld to protect integration data."
          exit 1

      - name: Export reach snapshot (real GA4 only)
        if: steps.gate.outputs.run == 'true'
        env:
          API_BASE: http://127.0.0.1:8001
          REQUIRE_GA: '1'
        run: |
          node scripts/deployment/export-edge-snapshots.mjs
          npx prettier --write workers/assistme-chat/src/edge-data-snapshot.js

      - name: Stop backend
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          if [ -f /tmp/uvicorn.pid ]; then
            kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true
          fi

      - name: Prepare reach snapshot review artifact
        id: review-artifact
        if: steps.gate.outputs.run == 'true'
        env:
          ARTIFACT_DIR: artifacts/analytics-reach-review
          CANDIDATE_PATH: workers/assistme-chat/src/edge-data-snapshot.js
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          if git diff --quiet -- "$CANDIDATE_PATH"; then
            changed=false
          else
            changed=true
          fi
          cat > "$ARTIFACT_DIR/manifest.json" <<EOF
          {
            "baseCommit": "${GITHUB_SHA}",
            "candidatePath": "${CANDIDATE_PATH}",
            "changed": ${changed},
            "candidateGenerated": true,
            "candidateIncluded": false
          }
          EOF
          cat > "$ARTIFACT_DIR/REVIEW.md" <<'EOF'
          # GA4 reach snapshot review

          This public-repository artifact intentionally excludes generated analytics and health
          values. It contains only a changed/unchanged signal and the target path, not a candidate
          snapshot, checksum, service-account data, or metric values.

          1. Read `manifest.json`. If `changed` is `false`, no follow-up is required.
          2. If it is `true`, an authorized maintainer must regenerate the candidate in a controlled
             environment before putting it on a human-owned branch.
          3. Inspect that candidate locally and open a normal, independently reviewed pull request;
             do not bypass branch protection.

          Do not copy analytics or health values into public issue comments, pull-request
          descriptions, job summaries, logs, or workflow artifacts.
          EOF
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Upload reach snapshot review artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: analytics-reach-review-${{ github.run_id }}
          path: artifacts/analytics-reach-review
          if-no-files-found: error
          retention-days: 2

      - name: Report reach snapshot review instructions
        if: steps.gate.outputs.run == 'true'
        env:
          ARTIFACT_NAME: analytics-reach-review-${{ github.run_id }}
          CHANGED: ${{ steps.review-artifact.outputs.changed }}
        run: |
          {
            echo "## GA4 reach snapshot review"
            echo "- Candidate changed: \`${CHANGED}\`."
            echo "- Review artifact: \`${ARTIFACT_NAME}\` (retained for 2 days)."
            echo "- No commit, branch, pull request, or deployment was created."
            echo ""
            echo "### Human review"
            echo "1. Read the artifact manifest; it intentionally excludes generated values."
            echo "2. If changed, regenerate the candidate in a controlled environment on a human-owned branch."
            echo "3. Inspect it and open a normal, independently reviewed pull request; do not bypass branch protection."
            echo ""
            echo "Analytics and health values are intentionally absent from this public artifact, summary, and workflow logs."
          } >> "$GITHUB_STEP_SUMMARY"
