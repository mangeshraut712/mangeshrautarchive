name: GitHub Repository & Stats Sync

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: github-stats-sync
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  sync-stats:
    name: Fetch & Cache GitHub Stats
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run GitHub Stats Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/integrations/sync-github-stats.mjs

      # A fixed head branch updates one draft PR instead of bypassing protected main.
      # The action exits without a PR when the sync leaves no diff.
      - name: Create or update draft stats sync PR
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/github-stats-sync
          delete-branch: true
          commit-message: 'chore(data): refresh GitHub stats cache'
          title: 'chore(data): refresh GitHub stats cache'
          body: |
            Refreshes the public GitHub statistics cache from the GitHub API.

            This draft is intentionally reviewable and must be merged through the repository's protected-branch process.
          draft: always-true
          add-paths: src/js/data/github-stats.json

      - name: Report sync result
        env:
          OPERATION: ${{ steps.create-pull-request.outputs.pull-request-operation }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
        run: |
          if [ "${OPERATION}" = "none" ]; then
            echo "GitHub stats cache unchanged; no pull request was created or updated."
          else
            echo "Draft pull request ${OPERATION}: ${PR_URL}"
          fi
