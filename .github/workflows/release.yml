name: Release Notes & Tagging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2026.1.0, or leave empty to auto-derive from changelog)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-tagging
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Release Metadata
        id: meta
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: node scripts/deployment/auto-release.mjs

      - name: Check if release tag already exists
        id: tag_check
        run: |
          TAG="${{ steps.meta.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is new."
          fi

      - name: Create Tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.tag_name }}
          body_path: dist-release-body.md
          draft: ${{ inputs.draft == true }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
