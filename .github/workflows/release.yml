name: Automated Release Notes & Tagging

on:
  push:
    branches: [main]
    paths:
      - 'src/js/data/changelog-entries.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tagging
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Release Metadata
        id: meta
        run: node scripts/deployment/auto-release.mjs

      - name: Check if release tag already exists
        id: tag_check
        run: |
          TAG="${{ steps.meta.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is new."
          fi

      - name: Create Tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.tag_name }}
          body_path: dist-release-body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
