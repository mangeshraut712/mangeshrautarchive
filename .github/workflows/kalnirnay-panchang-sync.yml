name: Daily official Kalnirnay Panchang

on:
  schedule:
    - cron: '15 1,7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalnirnay-panchang-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the official dated Panchang
        run: python scripts/integrations/sync-kalnirnay-panchang.py
      - name: Publish changed official values
        run: |
          if git diff --quiet -- src/assets/data/kalnirnay-panchang.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/assets/data/kalnirnay-panchang.json
          git commit -m 'chore(calendar): refresh official daily Panchang'
          git pull --rebase origin main
          git push origin main
