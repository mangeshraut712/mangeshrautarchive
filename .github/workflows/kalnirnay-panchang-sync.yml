name: Daily official Kalnirnay Panchang

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kalnirnay-panchang-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the official dated Panchang
        run: python scripts/integrations/sync-kalnirnay-panchang.py
      # A fixed head branch keeps daily source updates in one reviewable draft PR.
      - name: Create or update draft Panchang sync PR
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/kalnirnay-panchang-sync
          delete-branch: true
          commit-message: 'chore(calendar): refresh official daily Panchang'
          title: 'chore(calendar): refresh official daily Panchang'
          body: |
            Refreshes the official daily Panchang source data.

            This draft is intentionally reviewable and must be merged through the repository's protected-branch process.
          draft: always-true
          add-paths: src/assets/data/kalnirnay-panchang.json

      - name: Report Panchang sync result
        env:
          OPERATION: ${{ steps.create-pull-request.outputs.pull-request-operation }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
        run: |
          if [ "${OPERATION}" = "none" ]; then
            echo "Official Panchang data unchanged; no pull request was created or updated."
          else
            echo "Draft pull request ${OPERATION}: ${PR_URL}"
          fi
