  <text x="470" y="392" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Rigorous tool verification loops</text>
  <text x="470" y="412" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Native AST &amp; compiler diagnostics</text>

  <rect x="450" y="450" width="300" height="135" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="470" y="478" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f5f5f7">xAI API &amp; OpenRouter Routing</text>
  <text x="470" y="502" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">Model slug: grok-4.6</text>
  <text x="470" y="524" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">Prompt cache reads at ~0.25x price</text>
  <text x="470" y="546" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">Function calling &amp; code interpreter</text>
  <text x="470" y="566" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">Direct gateway compatibility</text>

  <!-- Connectors -->
  <path d="M 770 365 L 840 365" stroke="url(#cyan-copilot)" stroke-width="3" fill="none" filter="url(#glow-grok)"/>

