  <text x="88" y="244" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">Sub-second mention capture</text>
  <text x="88" y="264" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">Multi-modal video, audio &amp; text feeds</text>

  <rect x="70" y="295" width="270" height="115" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="88" y="322" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f5f5f7">Grok Imagine 2.0 Inpainting</text>
  <text x="88" y="344" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Quality Mode region editing</text>
  <text x="88" y="364" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Multi-reference visual reasoning</text>
  <text x="88" y="384" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• Real-time visual understanding</text>

