<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="grok-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="grok-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="amber-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f0a"/>
      <stop offset="50%" stop-color="#ff375f"/>
      <stop offset="100%" stop-color="#ff9f0a"/>
    </linearGradient>
    <linearGradient id="cyan-copilot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow-grok" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#grok-bg)"/>

  <!-- Title & Header -->
  <text x="600" y="52" font-family="-apple-system, SF Pro Display, sans-serif" font-size="26" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.5">GROK 4.6 &amp; GROK BOT: REAL-TIME AUTONOMOUS AGENT ECOSYSTEM</text>
  <text x="600" y="80" font-family="-apple-system, SF Pro Text, sans-serif" font-size="14" fill="#86868b" text-anchor="middle">500k Context Reasoning, GitHub Copilot IDE Integration &amp; Always-On Digital Teammate Loops (August 2026)</text>

  <!-- Left: Real-Time Event & Webhook Layer -->
  <rect x="50" y="120" width="310" height="490" rx="20" fill="url(#grok-glass)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="70" y="140" width="270" height="38" rx="8" fill="#ff9f0a" fill-opacity="0.15" stroke="#ff9f0a" stroke-opacity="0.4"/>
  <text x="205" y="164" font-family="-apple-system, SF Pro Display, sans-serif" font-size="16" font-weight="700" fill="#ff9f0a" text-anchor="middle">1. REAL-TIME EVENT STREAM</text>

  <rect x="70" y="195" width="270" height="85" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ff9f0a" stroke-opacity="0.4"/>
