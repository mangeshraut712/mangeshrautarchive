  <text x="88" y="474" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• GitHub issue &amp; PR triggers</text>
  <text x="88" y="494" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Slack / Discord team events</text>
  <text x="88" y="514" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Asynchronous task dispatch</text>
  <text x="88" y="534" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• Always-on teammate status</text>

