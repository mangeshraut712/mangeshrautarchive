  <text x="880" y="268" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">Native day-one Copilot provider</text>
  <text x="880" y="288" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">Whole-workspace agent chat</text>

  <rect x="860" y="320" width="270" height="115" rx="12" fill="#000000" fill-opacity="0.5" stroke="#30d158" stroke-opacity="0.4"/>
  <text x="880" y="348" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#30d158">Grok Bot Digital Teammate</text>
  <text x="880" y="372" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Logs into developer tooling</text>
  <text x="880" y="392" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Multi-step workflow automation</text>
  <text x="880" y="412" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Autonomous branch PR reviews</text>

  <rect x="860" y="450" width="270" height="135" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="880" y="478" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f5f5f7">Grok Build Harness (ACP)</text>
  <text x="880" y="502" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Open source Apache-2.0 TUI</text>
  <text x="880" y="522" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Sandboxed shell tool execution</text>
  <text x="880" y="542" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Streaming JSON-RPC to CI bots</text>
  <text x="880" y="562" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• Multi-file atomic diff commits</text>
</svg>