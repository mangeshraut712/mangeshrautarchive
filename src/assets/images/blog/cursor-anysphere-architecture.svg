<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="cursor-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="50%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="cursor-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="blue-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#2997ff"/>
    </linearGradient>
    <linearGradient id="purple-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#af52de"/>
      <stop offset="50%" stop-color="#5856d6"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <filter id="glow-cursor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#cursor-bg)"/>

  <!-- Title & Header -->
  <text x="600" y="50" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="25" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.5">THE ARCHITECTURE OF CURSOR: HOW ANYSPHERE BUILT THE AI-NATIVE IDE</text>
  <text x="600" y="78" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" fill="#86868b" text-anchor="middle">Escaping the Extension Sandbox: Root Access, Shadow Workspace, Speculative Diffs &amp; Codebase Indexing</text>

  <!-- Left: Escaping the Extension Trap -->
  <rect x="50" y="115" width="320" height="505" rx="20" fill="url(#cursor-glass)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="70" y="135" width="280" height="38" rx="8" fill="#ff3b30" fill-opacity="0.15" stroke="#ff3b30" stroke-opacity="0.4"/>
  <text x="210" y="159" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ff453a" text-anchor="middle">1. ESCAPING THE EXTENSION TRAP</text>

  <rect x="70" y="190" width="280" height="100" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ff453a" stroke-opacity="0.3"/>
  <text x="88" y="216" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#ff453a">The Extension Ceiling (2022)</text>
  <text x="88" y="238" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">• VS Code API sandboxes block raw UI</text>
  <text x="88" y="258" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• High latency IPC over extension host</text>
  <text x="88" y="278" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Cannot intercept keystrokes or diffs</text>

  <rect x="70" y="305" width="280" height="135" rx="12" fill="#000000" fill-opacity="0.5" stroke="#30d158" stroke-opacity="0.4"/>
  <text x="88" y="331" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#30d158">The "Root Access" Decision</text>
  <text x="88" y="353" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">• Hard fork of Visual Studio Code</text>
  <text x="88" y="373" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Deep control of Monaco editor core</text>
  <text x="88" y="393" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Sub-10ms key-event interception</text>
  <text x="88" y="413" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• 100% VS Code extension compatibility</text>

  <rect x="70" y="455" width="280" height="145" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="88" y="481" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f5f5f7">MIT Founding (Anysphere)</text>
  <text x="88" y="503" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Michael Truell, Aman Sanger</text>
  <text x="88" y="523" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Sualeh Asif, Arvid Lunnemark</text>
  <text x="88" y="543" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Seeded by OpenAI Startup Fund</text>
  <text x="88" y="563" font-family="-apple-system, sans-serif" font-size="12" fill="#2997ff">• Grew into $60B+ AI-native standard</text>

  <!-- Connector 1 -->
  <path d="M 370 365 L 430 365" stroke="url(#blue-stream)" stroke-width="3" fill="none" filter="url(#glow-cursor)"/>

  <!-- Middle: Core Engine & Shadow Workspace -->
  <rect x="430" y="115" width="340" height="505" rx="20" fill="url(#cursor-glass)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="450" y="135" width="300" height="38" rx="8" fill="#0071e3" fill-opacity="0.15" stroke="#0071e3" stroke-opacity="0.4"/>
  <text x="600" y="159" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#2997ff" text-anchor="middle">2. SHADOW WORKSPACE &amp; FAST-APPLY</text>

  <rect x="450" y="190" width="300" height="115" rx="12" fill="#000000" fill-opacity="0.5" stroke="#2997ff" stroke-opacity="0.4"/>
  <text x="468" y="216" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#2997ff">Shadow Workspace Engine</text>
  <text x="468" y="238" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">• Hidden background buffer execution</text>
  <text x="468" y="258" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Silent LSP &amp; linter diagnostics check</text>
  <text x="468" y="278" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• Verifies code before rendering to user</text>

  <rect x="450" y="320" width="300" height="135" rx="12" fill="#000000" fill-opacity="0.5" stroke="#5856d6" stroke-opacity="0.4"/>
  <text x="468" y="346" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#bf5af2">Speculative Fast-Apply Diffs</text>
  <text x="468" y="368" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">• Structural AST diff streaming</text>
  <text x="468" y="388" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Replaces slow line-by-line streaming</text>
  <text x="468" y="408" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• 1000+ lines applied in &lt;1.2 seconds</text>
  <text x="468" y="428" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• Red/green instant visual reconciliation</text>

  <rect x="450" y="470" width="300" height="130" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="468" y="496" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f5f5f7">Cursor Tab (Copilot++)</text>
  <text x="468" y="518" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Custom model on developer trajectories</text>
  <text x="468" y="538" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Predicts next edit location + content</text>
  <text x="468" y="558" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Multi-cursor jump suggestions</text>
  <text x="468" y="578" font-family="-apple-system, sans-serif" font-size="12" fill="#2997ff">• Tab-to-jump developer flow state</text>

  <!-- Connector 2 -->
  <path d="M 770 365 L 830 365" stroke="url(#purple-stream)" stroke-width="3" fill="none" filter="url(#glow-cursor)"/>

  <!-- Right: Codebase Indexing & Agent Swarms -->
  <rect x="830" y="115" width="320" height="505" rx="20" fill="url(#cursor-glass)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="850" y="135" width="280" height="38" rx="8" fill="#af52de" fill-opacity="0.15" stroke="#af52de" stroke-opacity="0.4"/>
  <text x="990" y="159" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#bf5af2" text-anchor="middle">3. COMPOSER &amp; REPO INDEXING</text>

  <rect x="850" y="190" width="280" height="115" rx="12" fill="#000000" fill-opacity="0.5" stroke="#af52de" stroke-opacity="0.4"/>
  <text x="868" y="216" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#bf5af2">Merkle Codebase Indexing</text>
  <text x="868" y="238" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">• Local Merkle tree diff hash tracker</text>
  <text x="868" y="258" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Hybrid sparse + dense embeddings</text>
  <text x="868" y="278" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• 100k+ file semantic symbol lookup</text>

  <rect x="850" y="320" width="280" height="135" rx="12" fill="#000000" fill-opacity="0.5" stroke="#00f0ff" stroke-opacity="0.3"/>
  <text x="868" y="346" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#00f0ff">Composer Multi-File Agent</text>
  <text x="868" y="368" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">• Repo-wide coordinated refactors</text>
  <text x="868" y="388" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Multi-file concurrent diff generation</text>
  <text x="868" y="408" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• .cursorrules contextual steering</text>
  <text x="868" y="428" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• Instant review, accept, or reject</text>

  <rect x="850" y="470" width="280" height="130" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="868" y="496" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f5f5f7">Rust Rewrite &amp; Agent Swarms</text>
  <text x="868" y="518" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Native Rust subsystems for concurrency</text>
  <text x="868" y="538" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Autonomous background agent swarms</text>
  <text x="868" y="558" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Model Context Protocol (MCP) support</text>
  <text x="868" y="578" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• Defines the 2026 AI-native standard</text>
</svg>
