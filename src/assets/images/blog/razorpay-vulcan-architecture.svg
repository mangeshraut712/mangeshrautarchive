<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0a0a0c; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="blueTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="greenTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34c759" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34c759" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="orangeTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9500" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff9500" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="purpleTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#af52de" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#af52de" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Title Header -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#0071e3" fill-opacity="0.2" stroke="#0071e3" stroke-width="1"/>
    <text x="80" y="18" fill="#2997ff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">RAZORPAY VULCAN</text>
    <text x="0" y="58" fill="#f5f5f7" font-size="28" font-weight="800" letter-spacing="-0.5">India's First Payments Foundation Model</text>
    <text x="0" y="82" fill="#86868b" font-size="14" font-weight="500">4 Billion Payments · 3 Trillion Data Points · Built with NVIDIA &amp; AWS</text>
  </g>

  <!-- Central Architecture Diagram -->
  <!-- Left Side: Ingestion Inputs -->
  <g transform="translate(60, 165)">
    <rect width="320" height="450" rx="18" fill="#14151b" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" filter="url(#cardGlow)"/>
    <text x="24" y="38" fill="#a1a1a6" font-size="13" font-weight="700" letter-spacing="0.8">1. TRAINING &amp; STREAM INGESTION</text>
    <text x="24" y="64" fill="#f5f5f7" font-size="16" font-weight="700">Financial Multi-Tokens</text>

    <!-- Ingestion Items -->
    <g transform="translate(20, 85)">
      <rect width="280" height="64" rx="10" fill="#1c1e27" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="18" y="26" fill="#2997ff" font-size="13" font-weight="700">4B+ Historical Payments</text>
      <text x="18" y="46" fill="#86868b" font-size="11">UPI, RuPay, Cards, NetBanking, Wallets</text>
    </g>
    <g transform="translate(20, 160)">
      <rect width="280" height="64" rx="10" fill="#1c1e27" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="18" y="26" fill="#af52de" font-size="13" font-weight="700">3T+ Transaction Telemetry</text>
      <text x="18" y="46" fill="#86868b" font-size="11">Latencies, bank downtimes, card bins, OTPs</text>
    </g>
    <g transform="translate(20, 235)">
      <rect width="280" height="64" rx="10" fill="#1c1e27" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="18" y="26" fill="#ff9500" font-size="13" font-weight="700">51,000+ Active Merchants</text>
      <text x="18" y="46" fill="#86868b" font-size="11">D2C, Enterprise, SaaS, E-Commerce signals</text>
    </g>
    <g transform="translate(20, 310)">
      <rect width="280" height="64" rx="10" fill="#1c1e27" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="18" y="26" fill="#34c759" font-size="13" font-weight="700">NVIDIA &amp; AWS Infrastructure</text>
      <text x="18" y="46" fill="#86868b" font-size="11">Trained and hosted sovereignly in India</text>
    </g>
  </g>

  <!-- Middle: The Foundation Transformer Engine -->
  <g transform="translate(410, 165)">
    <rect width="360" height="450" rx="18" fill="#14151b" stroke="#0071e3" stroke-opacity="0.3" stroke-width="1.5" filter="url(#cardGlow)"/>
    <text x="24" y="38" fill="#0071e3" font-size="13" font-weight="700" letter-spacing="0.8">2. UNIFIED FOUNDATION MODEL</text>
    <text x="24" y="64" fill="#f5f5f7" font-size="18" font-weight="700">Razorpay Vulcan Engine</text>

    <!-- Core Transformer Stack -->
    <g transform="translate(20, 85)">
      <rect width="320" height="85" rx="12" fill="url(#blueTile)" stroke="#0071e3" stroke-opacity="0.3"/>
      <text x="20" y="30" fill="#f5f5f7" font-size="14" font-weight="700">Dynamic Payment Routing</text>
      <text x="20" y="50" fill="#a1a1a6" font-size="12">Predicts issuer gateway health before firing requests,</text>
      <text x="20" y="68" fill="#2997ff" font-size="12" font-weight="600">cutting drop-offs across 100+ banking rails</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="320" height="85" rx="12" fill="url(#purpleTile)" stroke="#af52de" stroke-opacity="0.3"/>
      <text x="20" y="30" fill="#f5f5f7" font-size="14" font-weight="700">Global Fraud &amp; Risk Intelligence</text>
      <text x="20" y="50" fill="#a1a1a6" font-size="12">Cross-merchant behavioral anomaly detection</text>
      <text x="20" y="68" fill="#bf5af2" font-size="12" font-weight="600">8x international card fraud detection</text>
    </g>

    <g transform="translate(20, 285)">
      <rect width="320" height="85" rx="12" fill="url(#orangeTile)" stroke="#ff9500" stroke-opacity="0.3"/>
      <text x="20" y="30" fill="#f5f5f7" font-size="14" font-weight="700">Predictive Checkout Personalization</text>
      <text x="20" y="50" fill="#a1a1a6" font-size="12">Instant payment method ranking per user</text>
      <text x="20" y="68" fill="#ff9f0a" font-size="12" font-weight="600">1–2 Lakh more purchases completed / mo</text>
    </g>

    <!-- Learning Loop -->
    <rect x="20" y="385" width="320" height="42" rx="8" fill="#34c759" fill-opacity="0.1" stroke="#34c759" stroke-opacity="0.3"/>
    <text x="160" y="411" fill="#30d158" font-size="11" font-weight="700" text-anchor="middle">Every payment processed reinforces model weights</text>
  </g>

  <!-- Right Side: Production Impact Metrics -->
  <g transform="translate(800, 165)">
    <rect width="340" height="450" rx="18" fill="#14151b" stroke="#34c759" stroke-opacity="0.25" stroke-width="1" filter="url(#cardGlow)"/>
    <text x="24" y="38" fill="#30d158" font-size="13" font-weight="700" letter-spacing="0.8">3. PRODUCTION IMPACT (BETA)</text>
    <text x="24" y="64" fill="#f5f5f7" font-size="18" font-weight="700">Empirical Outcomes</text>

    <!-- Metrics Bento -->
    <g transform="translate(20, 85)">
      <rect width="300" height="74" rx="12" fill="url(#greenTile)" stroke="#34c759" stroke-opacity="0.3"/>
      <text x="20" y="32" fill="#30d158" font-size="22" font-weight="800">+8% to 10%</text>
      <text x="20" y="56" fill="#f5f5f7" font-size="12" font-weight="600">Payment Success Rate Lift</text>
    </g>

    <g transform="translate(20, 170)">
      <rect width="300" height="74" rx="12" fill="url(#purpleTile)" stroke="#af52de" stroke-opacity="0.3"/>
      <text x="20" y="32" fill="#bf5af2" font-size="22" font-weight="800">8x Fraud Detection</text>
      <text x="20" y="56" fill="#f5f5f7" font-size="12" font-weight="600">International Card Anomalies Stopped</text>
    </g>

    <g transform="translate(20, 255)">
      <rect width="300" height="74" rx="12" fill="url(#orangeTile)" stroke="#ff9500" stroke-opacity="0.3"/>
      <text x="20" y="32" fill="#ff9f0a" font-size="22" font-weight="800">5x Disputes Caught</text>
      <text x="20" y="56" fill="#f5f5f7" font-size="12" font-weight="600">Fraudulent Transactions Prevented</text>
    </g>

    <g transform="translate(20, 340)">
      <rect width="300" height="74" rx="12" fill="url(#blueTile)" stroke="#0071e3" stroke-opacity="0.3"/>
      <text x="20" y="32" fill="#2997ff" font-size="22" font-weight="800">+1–2 Lakh / Mo</text>
      <text x="20" y="56" fill="#f5f5f7" font-size="12" font-weight="600">Extra Checkouts via Personalization</text>
    </g>
  </g>
</svg>
