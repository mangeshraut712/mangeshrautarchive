<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0a0a0c; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f14"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#af52de" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#af52de" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34c759" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34c759" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#0071e3" fill-opacity="0.2" stroke="#0071e3" stroke-width="1"/>
    <text x="65" y="18" fill="#2997ff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">CURSOR ORIGIN</text>
    <text x="0" y="58" fill="#f5f5f7" font-size="28" font-weight="800" letter-spacing="-0.5">The Agent-Native Development Loop</text>
    <text x="0" y="82" fill="#86868b" font-size="14" font-weight="500">From an AI plugin on GitHub to a unified, autonomous code-hosting and deployment infrastructure</text>
  </g>

  <!-- Top Flow Comparison: Old vs New -->
  
  <!-- Left Side: Legacy Extension Model -->
  <g transform="translate(60, 175)">
    <rect width="510" height="440" rx="20" fill="#141417" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" filter="url(#cardShadow)"/>
    <text x="30" y="42" fill="#ff453a" font-size="14" font-weight="700" letter-spacing="0.5">LEGACY EXTENSION MODEL</text>
    <text x="30" y="68" fill="#f5f5f7" font-size="18" font-weight="700">Fragmented &amp; GitHub Dependent</text>
    <text x="30" y="92" fill="#86868b" font-size="13">High latency, sandbox barriers, repeated API/Actions downtime</text>

    <!-- Flow Stack -->
    <g transform="translate(30, 115)">
      <rect width="450" height="52" rx="10" fill="#1c1c20" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="28" cy="26" r="12" fill="#3a3a3c"/>
      <text x="28" y="30" fill="#f5f5f7" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <text x="54" y="24" fill="#f5f5f7" font-size="14" font-weight="600">Local VS Code Extension</text>
      <text x="54" y="40" fill="#86868b" font-size="11">Sandboxed in Node IPC, cannot intercept native keystrokes</text>

      <path d="M 225 56 L 225 76" stroke="#ff453a" stroke-width="2" stroke-dasharray="4 3"/>

      <g transform="translate(0, 80)">
        <rect width="450" height="52" rx="10" fill="#1c1c20" stroke="#ffffff" stroke-opacity="0.06"/>
        <circle cx="28" cy="26" r="12" fill="#3a3a3c"/>
        <text x="28" y="30" fill="#f5f5f7" font-size="11" font-weight="700" text-anchor="middle">2</text>
        <text x="54" y="24" fill="#f5f5f7" font-size="14" font-weight="600">Remote GitHub Remote Repo</text>
        <text x="54" y="40" fill="#ff453a" font-size="11">Single point of failure (71% Actions failures during Aug incidents)</text>
      </g>

      <path d="M 225 136 L 225 156" stroke="#ff453a" stroke-width="2" stroke-dasharray="4 3"/>

      <g transform="translate(0, 160)">
        <rect width="450" height="52" rx="10" fill="#1c1c20" stroke="#ffffff" stroke-opacity="0.06"/>
        <circle cx="28" cy="26" r="12" fill="#3a3a3c"/>
        <text x="28" y="30" fill="#f5f5f7" font-size="11" font-weight="700" text-anchor="middle">3</text>
        <text x="54" y="24" fill="#f5f5f7" font-size="14" font-weight="600">Disconnected Cloud CI &amp; Deployments</text>
        <text x="54" y="40" fill="#86868b" font-size="11">Async webhooks, manual conflict resolution, slow feedback</text>
      </g>
    </g>

    <!-- Legacy Limitation Badge -->
    <rect x="30" y="360" width="450" height="50" rx="10" fill="#ff453a" fill-opacity="0.08" stroke="#ff453a" stroke-opacity="0.25"/>
    <text x="45" y="382" fill="#ff453a" font-size="12" font-weight="700">FAILURE MODE</text>
    <text x="45" y="398" fill="#d2d2d7" font-size="12">When GitHub drops, agents halt. Zero native multi-agent code-hosting.</text>
  </g>

  <!-- Right Side: Cursor Origin Agent-Native Stack -->
  <g transform="translate(630, 175)">
    <rect width="510" height="440" rx="20" fill="#141417" stroke="#0071e3" stroke-opacity="0.3" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="30" y="42" fill="#2997ff" font-size="14" font-weight="700" letter-spacing="0.5">CURSOR ORIGIN ARCHITECTURE</text>
    <text x="30" y="68" fill="#f5f5f7" font-size="18" font-weight="700">Native Code Hosting + Agent Swarms</text>
    <text x="30" y="92" fill="#86868b" font-size="13">Code, PRs, agents, CI, and Vercel hosting merged into one loop</text>

    <!-- Architecture Bento -->
    <g transform="translate(30, 115)">
      <!-- Tier 1: Origin Core -->
      <rect width="450" height="65" rx="12" fill="url(#blueCard)" stroke="#0071e3" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="28" cy="32" r="14" fill="#0071e3"/>
      <text x="28" y="37" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">A</text>
      <text x="54" y="28" fill="#f5f5f7" font-size="14" font-weight="700">Cursor-Hosted Repositories &amp; Native PRs</text>
      <text x="54" y="48" fill="#a1a1a6" font-size="11">Fast git storage, code browsing, comments, two-way GitHub sync</text>

      <!-- Tier 2: Agent Swarm Layer -->
      <g transform="translate(0, 75)">
        <rect width="450" height="65" rx="12" fill="url(#purpleCard)" stroke="#af52de" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="28" cy="32" r="14" fill="#af52de"/>
        <text x="28" y="37" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">B</text>
        <text x="54" y="28" fill="#f5f5f7" font-size="14" font-weight="700">Autonomous Agents Beside the Code</text>
        <text x="54" y="48" fill="#a1a1a6" font-size="11">Semantic AST index, auto-commit, branch pushing, and automated PR reviews</text>
      </g>

      <!-- Tier 3: Verified Deployment -->
      <g transform="translate(0, 150)">
        <rect width="450" height="65" rx="12" fill="url(#greenCard)" stroke="#34c759" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="28" cy="32" r="14" fill="#34c759"/>
        <text x="28" y="37" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">C</text>
        <text x="54" y="28" fill="#f5f5f7" font-size="14" font-weight="700">Integrated CI &amp; Vercel Deployments</text>
        <text x="54" y="48" fill="#a1a1a6" font-size="11">Direct Vercel preview/prod deploys + Buildkite &amp; Depot distributed pipelines</text>
      </g>
    </g>

    <!-- Origin Outcome Banner -->
    <g transform="translate(30, 345)">
      <rect width="450" height="65" rx="10" fill="#0071e3" fill-opacity="0.1" stroke="#0071e3" stroke-opacity="0.3"/>
      <text x="20" y="26" fill="#2997ff" font-size="13" font-weight="700">THE AGENTIC ADVANTAGE</text>
      <text x="20" y="46" fill="#f5f5f7" font-size="12">IDE ➔ Agents ➔ Repositories ➔ Pull Requests ➔ CI ➔ Deployment</text>
    </g>
  </g>
</svg>
