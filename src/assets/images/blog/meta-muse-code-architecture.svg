<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="muse-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="50%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="muse-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="meta-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0081fb"/>
      <stop offset="50%" stop-color="#0064e0"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f0a"/>
      <stop offset="100%" stop-color="#ff375f"/>
    </linearGradient>
    <filter id="glow-meta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#muse-bg)"/>

  <!-- Title & Meta Header -->
  <text x="600" y="52" font-family="-apple-system, SF Pro Display, sans-serif" font-size="26" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.5">META MUSE CODE &amp; MUSE SPARK 1.2 ARCHITECTURE</text>
  <text x="600" y="80" font-family="-apple-system, SF Pro Text, sans-serif" font-size="14" fill="#86868b" text-anchor="middle">Autonomous Terminal Coding Agent with Async Sub-Agents &amp; Git Worktree Isolation (2026)</text>

  <!-- Left Pillar: Terminal CLI & Plan Protocol -->
  <rect x="50" y="120" width="310" height="490" rx="20" fill="url(#muse-glass)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="70" y="140" width="270" height="38" rx="8" fill="#0081fb" fill-opacity="0.15" stroke="#0081fb" stroke-opacity="0.4"/>
  <text x="205" y="164" font-family="-apple-system, SF Pro Display, sans-serif" font-size="16" font-weight="700" fill="#0081fb" text-anchor="middle">1. TERMINAL AGENT HARNESS</text>

  <rect x="70" y="195" width="270" height="85" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="88" y="222" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f5f5f7">Interactive CLI &amp; TUI</text>
  <text x="88" y="244" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">curl -fsSL https://dev.meta.ai | bash</text>
  <text x="88" y="264" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">Single binary installation</text>

  <rect x="70" y="295" width="270" height="100" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="88" y="322" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f5f5f7">Built-in Skills &amp; Commands</text>
  <text x="88" y="344" font-family="SFMono-Regular, monospace" font-size="12" fill="#2997ff">/plan  <tspan fill="#86868b">→ approval-gated specs</tspan></text>
  <text x="88" y="364" font-family="SFMono-Regular, monospace" font-size="12" fill="#ff9f0a">/grill <tspan fill="#86868b">→ plan stress-testing</tspan></text>
  <text x="88" y="384" font-family="SFMono-Regular, monospace" font-size="12" fill="#30d158">/goal  <tspan fill="#86868b">→ autonomous drive</tspan></text>

  <rect x="70" y="410" width="270" height="175" rx="12" fill="#000000" fill-opacity="0.5" stroke="#0081fb" stroke-opacity="0.3"/>
  <text x="88" y="438" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#0081fb">Append-Only Event Log</text>
  <text x="88" y="462" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">~/.muse/events.jsonl</text>
  <text x="88" y="484" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Crash-safe session resume</text>
  <text x="88" y="504" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Immutable audit trail of edits</text>
  <text x="88" y="524" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Tool call replay &amp; validation</text>
  <text x="88" y="546" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• Zero cloud state lock-in</text>

  <!-- Connectors -->
  <path d="M 360 365 L 430 365" stroke="url(#meta-blue)" stroke-width="3" fill="none" filter="url(#glow-meta)"/>

  <!-- Middle Pillar: Muse Spark 1.2 Core Model -->
  <rect x="430" y="120" width="340" height="490" rx="20" fill="url(#muse-glass)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="450" y="140" width="300" height="38" rx="8" fill="#0081fb" fill-opacity="0.15" stroke="#0081fb" stroke-opacity="0.4"/>
  <text x="600" y="164" font-family="-apple-system, SF Pro Display, sans-serif" font-size="16" font-weight="700" fill="#0081fb" text-anchor="middle">2. MUSE SPARK 1.2 ENGINE</text>

  <rect x="450" y="195" width="300" height="110" rx="12" fill="#000000" fill-opacity="0.5" stroke="#00c6ff" stroke-opacity="0.4"/>
  <text x="470" y="224" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#00c6ff">Multi-Token Prediction (MTP)</text>
  <text x="470" y="248" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">4-token simultaneous speculative draft</text>
  <text x="470" y="270" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">3.2x inference speedup over single-token</text>
  <text x="470" y="290" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">Syntactic tree validation in parallel</text>

  <rect x="450" y="320" width="300" height="115" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="470" y="348" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#f5f5f7">Whole-Repo AST Indexing</text>
  <text x="470" y="372" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Tree-sitter incremental parser</text>
  <text x="470" y="392" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Symbol call-graph dependency map</text>
  <text x="470" y="412" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Cross-file type checker hooks</text>

  <rect x="450" y="450" width="300" height="135" rx="12" fill="#000000" fill-opacity="0.5" stroke="#30d158" stroke-opacity="0.4"/>
  <text x="470" y="478" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#30d158">Superintelligence Labs Tuning</text>
  <text x="470" y="502" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">Trained on verified repo executions</text>
  <text x="470" y="524" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">DeepSWE benchmark parity</text>
  <text x="470" y="546" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">Open weights for self-hosted clusters</text>
  <text x="470" y="566" font-family="-apple-system, sans-serif" font-size="12" fill="#0081fb">Direct competition with Claude Code</text>

  <!-- Connectors -->
  <path d="M 770 365 L 840 365" stroke="url(#meta-blue)" stroke-width="3" fill="none" filter="url(#glow-meta)"/>

  <!-- Right Pillar: Parallel Async Sub-Agents & Git Worktrees -->
  <rect x="840" y="120" width="310" height="490" rx="20" fill="url(#muse-glass)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="860" y="140" width="270" height="38" rx="8" fill="#0081fb" fill-opacity="0.15" stroke="#0081fb" stroke-opacity="0.4"/>
  <text x="995" y="164" font-family="-apple-system, SF Pro Display, sans-serif" font-size="16" font-weight="700" fill="#0081fb" text-anchor="middle">3. ASYNC WORKTREE POOL</text>

  <rect x="860" y="195" width="270" height="110" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ff9f0a" stroke-opacity="0.4"/>
  <text x="880" y="224" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#ff9f0a">Background Research Agent</text>
  <text x="880" y="248" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Explores docs &amp; codebase async</text>
  <text x="880" y="268" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Gathers context during planning</text>
  <text x="880" y="288" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• Zero blocking of main thread</text>

  <rect x="860" y="320" width="270" height="115" rx="12" fill="#000000" fill-opacity="0.5" stroke="#bf5af2" stroke-opacity="0.4"/>
  <text x="880" y="348" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#bf5af2">Isolated Git Worktrees</text>
  <text x="880" y="372" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• .git/worktrees/subagent-1</text>
  <text x="880" y="392" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• .git/worktrees/subagent-2</text>
  <text x="880" y="412" font-family="-apple-system, sans-serif" font-size="12" fill="#d1d1d6">• Prevents multi-agent file collisions</text>

  <rect x="860" y="450" width="270" height="135" rx="12" fill="#000000" fill-opacity="0.5" stroke="#30d158" stroke-opacity="0.4"/>
  <text x="880" y="478" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#30d158">Automated Verifier Agent</text>
  <text x="880" y="502" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Runs tests in sandbox</text>
  <text x="880" y="522" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Lints diffs before main merge</text>
  <text x="880" y="542" font-family="-apple-system, sans-serif" font-size="12" fill="#86868b">• Proves correctness via tests</text>
  <text x="880" y="562" font-family="-apple-system, sans-serif" font-size="12" fill="#30d158">• Auto-generates walkthroughs</text>
</svg>