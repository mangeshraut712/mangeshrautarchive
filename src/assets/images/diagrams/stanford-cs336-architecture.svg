<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-label="Stanford CS336 LLM Architecture from Scratch">
  <style>
    .bg { fill: #fbfbfd; }
    .card-bg { fill: #ffffff; stroke: #e5e5ea; stroke-width: 1.5px; }
    .card-bg-accent { fill: #f5f8ff; stroke: #0071e3; stroke-width: 1.5px; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #1d1d1f; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 11px; fill: #86868b; }
    .node-tag { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #0071e3; }
    .edge { stroke: #0071e3; stroke-width: 2px; fill: none; stroke-linecap: round; stroke-dasharray: 6 4; }
    .edge-solid { stroke: #d2d2d7; stroke-width: 1.5px; fill: none; stroke-linecap: round; }
    .badge-pill { fill: #e8f2ff; rx: 6px; }
    .section-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #1d1d1f; }
    .section-desc { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 12px; fill: #6e6e73; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #000000; }
      .card-bg { fill: #1c1c1e; stroke: #2c2c2e; }
      .card-bg-accent { fill: #0f1c2e; stroke: #0a84ff; }
      .node-title { fill: #f5f5f7; }
      .node-sub { fill: #98989d; }
      .node-tag { fill: #64d2ff; }
      .edge { stroke: #0a84ff; }
      .edge-solid { stroke: #38383a; }
      .badge-pill { fill: #102a45; }
      .section-title { fill: #f5f5f7; }
      .section-desc { fill: #86868b; }
    }
  </style>

  <rect width="960" height="540" rx="20" class="bg" />

  <g transform="translate(40, 36)">
    <text class="section-title" x="0" y="0">Stanford CS336 — Language Model Systems from Scratch</text>
    <text class="section-desc" x="0" y="22">Byte-Pair Encoding (BPE) • Transformer Decoder • RMSNorm &amp; RoPE • Distributed Data Parallel (DDP)</text>
  </g>

  <!-- Flow Edges -->
  <path class="edge" d="M 170 180 L 220 180" />
  <path class="edge" d="M 400 180 L 450 180" />
  <path class="edge" d="M 640 180 L 690 180" />

  <path class="edge-solid" d="M 310 260 L 310 320" />
  <path class="edge-solid" d="M 545 260 L 545 320" />
  <path class="edge-solid" d="M 785 260 L 785 320" />

  <!-- Node 1: Corpus & Tokenizer -->
  <g transform="translate(40, 110)">
    <rect width="130" height="150" rx="14" class="card-bg" />
    <rect x="15" y="15" width="56" height="18" class="badge-pill" />
    <text class="node-tag" x="43" y="28" text-anchor="middle">STAGE 1</text>
    <text class="node-title" x="15" y="58">BPE Tokenizer</text>
    <text class="node-sub" x="15" y="78">50K Vocabulary</text>
    <text class="node-sub" x="15" y="98">• Byte-level regex</text>
    <text class="node-sub" x="15" y="116">• Special tokens</text>
    <text class="node-sub" x="15" y="134">• Fast C++ merge</text>
  </g>

  <!-- Node 2: Transformer Core -->
  <g transform="translate(220, 110)">
    <rect width="180" height="150" rx="14" class="card-bg-accent" />
    <rect x="15" y="15" width="80" height="18" class="badge-pill" />
    <text class="node-tag" x="55" y="28" text-anchor="middle">ARCHITECTURE</text>
    <text class="node-title" x="15" y="58">Transformer Decoder</text>
    <text class="node-sub" x="15" y="78">Attention Stack</text>
    <text class="node-sub" x="15" y="98">• Multi-Head Self-Attn</text>
    <text class="node-sub" x="15" y="116">• Rotary Embeddings (RoPE)</text>
    <text class="node-sub" x="15" y="134">• RMSNorm &amp; SwiGLU</text>
  </g>

  <!-- Node 3: Optimization & Kernels -->
  <g transform="translate(450, 110)">
    <rect width="190" height="150" rx="14" class="card-bg" />
    <rect x="15" y="15" width="76" height="18" class="badge-pill" />
    <text class="node-tag" x="53" y="28" text-anchor="middle">OPTIMIZATION</text>
    <text class="node-title" x="15" y="58">FlashAttention &amp; CUDA</text>
    <text class="node-sub" x="15" y="78">Kernel Acceleration</text>
    <text class="node-sub" x="15" y="98">• Tiled Attention IO</text>
    <text class="node-sub" x="15" y="116">• Mixed Precision (bf16)</text>
    <text class="node-sub" x="15" y="134">• AdamW with Cosine LR</text>
  </g>

  <!-- Node 4: Distributed Training -->
  <g transform="translate(690, 110)">
    <rect width="210" height="150" rx="14" class="card-bg-accent" />
    <rect x="15" y="15" width="60" height="18" class="badge-pill" />
    <text class="node-tag" x="45" y="28" text-anchor="middle">TRAINING</text>
    <text class="node-title" x="15" y="58">Distributed DDP &amp; FSDP</text>
    <text class="node-sub" x="15" y="78">Multi-GPU Cluster</text>
    <text class="node-sub" x="15" y="98">• AllReduce Gradient Sync</text>
    <text class="node-sub" x="15" y="116">• Sharded Model States</text>
    <text class="node-sub" x="15" y="134">• Perplexity Metric: 14.2</text>
  </g>

  <!-- Subsystems -->
  <g transform="translate(220, 320)">
    <rect width="180" height="150" rx="14" class="card-bg" />
    <text class="node-title" x="15" y="32">Positional Encodings</text>
    <text class="node-sub" x="15" y="52">• RoPE complex rotations</text>
    <text class="node-sub" x="15" y="72">• Zero trainable params</text>
    <text class="node-sub" x="15" y="92">• Extrapolates to 16k context</text>
  </g>

  <g transform="translate(450, 320)">
    <rect width="190" height="150" rx="14" class="card-bg" />
    <text class="node-title" x="15" y="32">Gradient Checkpointing</text>
    <text class="node-sub" x="15" y="52">• Trade compute for VRAM</text>
    <text class="node-sub" x="15" y="72">• Recompute forward pass</text>
    <text class="node-sub" x="15" y="92">• 60% memory reduction</text>
  </g>

  <g transform="translate(690, 320)">
    <rect width="210" height="150" rx="14" class="card-bg" />
    <text class="node-title" x="15" y="32">WandB Live Telemetry</text>
    <text class="node-sub" x="15" y="52">• Validation Loss Tracking</text>
    <text class="node-sub" x="15" y="72">• Gradient Norm Monitoring</text>
    <text class="node-sub" x="15" y="92">• Token throughput / sec</text>
  </g>
</svg>
